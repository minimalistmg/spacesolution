<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01 · Studio tilt — Interior Depth Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="idh-nav">
      <a class="idh-nav__mark" href="../index.html">space <span>SOLUTION</span></a>
      <a href="../index.html">← Concepts</a>
    </header>

    <!--
      CONFIG: replace IMAGE_SRC to swap the diorama.
      Optional layers: add more [data-depth-layer] figures with transparent PNGs
      (1 = base, 1.5 = furniture, 2 = foreground).
    -->
    <section
      class="idh-hero"
      data-depth-hero
      aria-label="Residential interiors"
    >
      <div class="idh-hero__grid">
        <div class="idh-hero__copy">
          <p class="idh-hero__eyebrow">Home Interiors / Residential</p>
          <h1 class="idh-hero__title">
            <span class="idh-hero__title-light">Free 3D</span>
            <span class="idh-hero__title-dark">Home Interiors</span>
          </h1>
          <p class="idh-hero__lead">
            Your home should reflect your personality. We deliver end-to-end interior
            solutions from kitchens to bedrooms.
          </p>
          <a class="idh-hero__cta" href="#">Get Quote Now</a>
        </div>

        <div class="idh-hero__visual">
          <div class="idh-hero__stats" role="list">
            <div class="idh-hero__stat" role="listitem">
              <span class="idh-hero__stat-value">15+</span>
              <span class="idh-hero__stat-label">Years</span>
            </div>
            <div class="idh-hero__stat" role="listitem">
              <span class="idh-hero__stat-value">800+</span>
              <span class="idh-hero__stat-label">Homes</span>
            </div>
            <div class="idh-hero__stat" role="listitem">
              <span class="idh-hero__stat-value">1</span>
              <span class="idh-hero__stat-label">Factory</span>
            </div>
          </div>

          <div class="idh-stage" data-depth-stage>
            <div class="idh-stage__shadow" data-depth-shadow aria-hidden="true"></div>

            <div class="idh-stage__rig" data-depth-rig>
              <div class="idh-stage__layers">
                <!-- Base interior (replace path to swap image) -->
                <figure class="idh-layer idh-layer--base" data-depth-layer="1">
                  <img
                    src="../../../src/assets/images/open-house/open-house-1.png"
                    alt="Isometric open-house view of a Space Solutions home interior"
                    width="1200"
                    height="825"
                    decoding="async"
                    fetchpriority="high"
                  />
                </figure>

                <!-- Optional mid / fore depth cues (no extra assets required) -->
                <div
                  class="idh-layer idh-layer--mid"
                  data-depth-layer="1.5"
                  aria-hidden="true"
                ></div>
                <div
                  class="idh-layer idh-layer--fore"
                  data-depth-layer="2"
                  aria-hidden="true"
                ></div>
              </div>
            </div>
          </div>

          <p class="idh-hint">Move across the interior</p>
        </div>
      </div>
    </section>

    <div class="idh-filler" aria-hidden="true">Scroll content placeholder</div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="./depth-hero.js"></script>
  </body>
</html>
