<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>03 · Home Services — Interior Depth Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="hs-nav">
      <a class="hs-nav__mark" href="../index.html">space <span>SOLUTION</span></a>
      <a href="../index.html">← Concepts</a>
    </header>

    <section class="hs-hero" data-home-services-hero aria-label="Home interiors services">
      <div class="hs-hero__grid">
        <!-- Left: copy + stats + service nav -->
        <div class="hs-copy">
          <p class="hs-copy__eyebrow" data-hs-eyebrow>Home Interiors / By room</p>

          <h1 class="hs-copy__title" data-hs-title>
            <span class="hs-copy__title-light" data-hs-title-light>Modular</span>
            <span data-hs-title-dark>Kitchen</span>
          </h1>

          <p class="hs-copy__lead" data-hs-lead>
            Layouts and storage built for how you cook every day — factory-made,
            moisture-ready, and installed by one Mysuru team.
          </p>

          <a class="hs-copy__cta" href="/modular-kitchen" data-hs-cta>
            <span data-hs-cta-label>Explore Kitchens</span>
            <span class="hs-copy__cta-sheen" data-hs-cta-sheen aria-hidden="true"></span>
          </a>

          <ul class="hs-copy__stats" role="list">
            <li class="hs-copy__stat" role="listitem">
              <span class="hs-copy__stat-value">15+</span>
              <span class="hs-copy__stat-label">Years</span>
            </li>
            <li class="hs-copy__stat" role="listitem">
              <span class="hs-copy__stat-value">800+</span>
              <span class="hs-copy__stat-label">Homes</span>
            </li>
            <li class="hs-copy__stat" role="listitem">
              <span class="hs-copy__stat-value">1</span>
              <span class="hs-copy__stat-label">Factory</span>
            </li>
          </ul>

          <ul class="hs-copy__nav" data-hs-nav aria-label="Home interior services"></ul>
        </div>

        <!-- Right: large 3D stage -->
        <div class="hs-visual">
          <div class="hs-stage" data-hs-stage>
            <div class="hs-stage__glow" data-hs-glow aria-hidden="true"></div>
            <div class="hs-stage__shadow" data-hs-shadow aria-hidden="true"></div>

            <div class="hs-stage__rig" data-hs-rig>
              <div class="hs-stage__frame">
                <figure class="hs-house" data-hs-house>
                  <img
                    src="../../../src/assets/images/open-house/open-house-1.png"
                    alt="Space Solutions full-home open-house interior"
                    width="1200"
                    height="825"
                    fetchpriority="high"
                  />
                </figure>

                <div class="hs-stage__spotlight" data-hs-spotlight aria-hidden="true"></div>
                <div class="hs-stage__sheen" data-hs-sheen aria-hidden="true"></div>

                <div class="hs-fills" aria-hidden="true">
                  <div class="hs-fill is-active" data-hs-fill data-service="kitchen"></div>
                  <div class="hs-fill" data-hs-fill data-service="wardrobe"></div>
                  <div class="hs-fill" data-hs-fill data-service="living"></div>
                  <div class="hs-fill" data-hs-fill data-service="bedroom"></div>
                  <div class="hs-fill" data-hs-fill data-service="pooja"></div>
                  <div class="hs-fill" data-hs-fill data-service="full"></div>
                </div>

                <div class="hs-zones" data-hs-zones>
                  <button type="button" class="hs-zone" data-hs-zone data-service="kitchen" aria-label="Modular Kitchen"></button>
                  <button type="button" class="hs-zone" data-hs-zone data-service="living" aria-label="Living & Dining"></button>
                  <button type="button" class="hs-zone" data-hs-zone data-service="bedroom" aria-label="Bedrooms"></button>
                  <button type="button" class="hs-zone" data-hs-zone data-service="pooja" aria-label="Pooja Room"></button>
                  <button type="button" class="hs-zone" data-hs-zone data-service="wardrobe" aria-label="Wardrobes & Storage"></button>
                </div>
              </div>
            </div>

            <div class="hs-progress" aria-hidden="true">
              <span class="hs-progress__bar" data-hs-progress></span>
            </div>
          </div>

          <p class="hs-hint" data-hs-hint>Auto touring · hover to take control</p>
        </div>
      </div>
    </section>

    <script src="../../../public/vendor/gsap.min.js"></script>
    <script src="../../../public/vendor/CustomEase.min.js"></script>
    <script src="../../../public/vendor/SplitText.min.js"></script>
    <script src="./home-services.js"></script>
  </body>
</html>
