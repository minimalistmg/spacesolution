<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preloader — Blueprint Reveal</title>
    <link rel="preload" href="../../../brand/icon-source.png" as="image" />
    <link rel="stylesheet" href="../../../assets/fonts/gotham/gotham.css" />
    <link rel="stylesheet" href="../_shared/brand.css" />
    <link rel="stylesheet" href="../_shared/page-shell.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-preloading">
    <header class="page-header">
      <div class="page-header__slot" data-page-logo-slot></div>
      <nav class="page-nav" aria-label="Primary">
        <a href="#">About</a><a href="#">Services</a><a href="#">Projects</a><a href="#">Contact</a>
      </nav>
    </header>

    <main class="page-hero">
      <div class="page-hero__media">
        <img src="../../../src/assets/images/hero/kitchen-1.jpeg" alt="" />
        <div class="page-hero__shade"></div>
      </div>
      <div class="page-hero__copy">
        <h1>Interiors designed to work.</h1>
        <p>Modular furniture and turnkey spaces across Karnataka — 15+ years of craft.</p>
      </div>
    </main>

    <div class="pl-preloader" data-pl-preloader aria-hidden="false">
      <div class="pl-grid" aria-hidden="true"></div>
      <div class="pl-blueprint-lines" aria-hidden="true"></div>
      <div class="pl-stage">
        <div class="pl-lockup-host" data-pl-lockup-host></div>
        <div class="pl-pen" data-pl-pen aria-hidden="true"></div>
      </div>
      <div class="pl-concrete" data-pl-concrete aria-hidden="true"></div>
      <footer class="pl-footer">
        <div class="pl-progress">
          <div class="pl-progress__track"><div class="pl-progress__fill" data-pl-progress-fill></div></div>
          <span class="pl-progress__pct" data-pl-progress-pct>0%</span>
        </div>
        <button type="button" class="pl-enter" data-pl-enter hidden>Enter Site</button>
      </footer>
    </div>

    <button type="button" class="preloader-skip preloader-skip--light" data-pl-skip>Skip</button>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="../_shared/brand-mark.js"></script>
    <script src="../_shared/preloader-utils.js"></script>
    <script src="./blueprint.js"></script>
  </body>
</html>
