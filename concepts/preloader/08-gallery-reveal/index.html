<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preloader — Gallery Reveal</title>
    <link rel="preload" href="../../../brand/icon-source.png" as="image" />
    <link rel="stylesheet" href="../../../assets/fonts/gotham/gotham.css" />
    <link rel="stylesheet" href="../_shared/brand.css" />
    <link rel="stylesheet" href="../_shared/page-shell.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-preloading">
    <header class="page-header">
      <div class="page-header__slot"></div>
      <nav class="page-nav" aria-label="Primary">
        <a href="#">About</a><a href="#">Services</a><a href="#">Projects</a><a href="#">Contact</a>
      </nav>
    </header>
    <main class="page-hero">
      <div class="page-hero__media">
        <img src="../../../src/assets/images/hero/bedroom.jpg" alt="" />
        <div class="page-hero__shade"></div>
      </div>
      <div class="page-hero__copy">
        <h1>Curated like a gallery.</h1>
        <p>Every material chosen, every plane considered.</p>
      </div>
    </main>

    <div class="pl-preloader" data-pl-preloader>
      <div class="pl-gallery" data-pl-gallery>
        <div class="pl-pedestal" data-pl-pedestal><div class="pl-cube pl-cube--marble" data-pl-cube></div></div>
        <div class="pl-pedestal" data-pl-pedestal><div class="pl-cube pl-cube--wood" data-pl-cube></div></div>
        <div class="pl-pedestal" data-pl-pedestal><div class="pl-cube pl-cube--gold" data-pl-cube></div></div>
        <div class="pl-pedestal" data-pl-pedestal><div class="pl-cube pl-cube--fabric" data-pl-cube></div></div>
      </div>
      <div class="pl-wall" data-pl-wall>
        <div class="pl-lockup-host brand-lockup--center" data-pl-lockup-host></div>
      </div>
      <footer class="pl-footer">
        <p class="pl-status" data-pl-status>Curation area… 15%</p>
        <div class="pl-progress"><div class="pl-progress__fill" data-pl-progress-fill></div></div>
      </footer>
    </div>
    <button type="button" class="preloader-skip" data-pl-skip>Skip</button>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="../_shared/brand-mark.js"></script>
    <script src="../_shared/preloader-utils.js"></script>
    <script src="./gallery.js"></script>
  </body>
</html>
