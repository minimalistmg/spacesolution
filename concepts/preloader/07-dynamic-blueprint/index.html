<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preloader — Dynamic Blueprint</title>
    <link rel="preload" href="../../../brand/icon-source.png" as="image" />
    <link rel="stylesheet" href="../../../assets/fonts/gotham/gotham.css" />
    <link rel="stylesheet" href="../_shared/brand.css" />
    <link rel="stylesheet" href="../_shared/page-shell.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-preloading">
    <header class="page-header">
      <div class="page-header__slot"></div>
      <nav class="page-nav" aria-label="Primary">
        <a href="#">About</a><a href="#">Services</a><a href="#">Projects</a><a href="#">Contact</a>
      </nav>
    </header>
    <main class="page-hero">
      <div class="page-hero__media">
        <img src="../../../src/assets/images/projects/modular-kitchen.jpeg" alt="" />
        <div class="page-hero__shade"></div>
      </div>
      <div class="page-hero__copy">
        <h1>Drawn with intent.</h1>
        <p>From technical trace to finished interior.</p>
      </div>
    </main>

    <div class="pl-preloader" data-pl-preloader>
      <div class="pl-grid"></div>
      <div class="pl-masks">
        <div class="pl-mask pl-mask--tl" data-pl-mask></div>
        <div class="pl-mask pl-mask--tr" data-pl-mask></div>
        <div class="pl-mask pl-mask--bl" data-pl-mask></div>
        <div class="pl-mask pl-mask--br" data-pl-mask></div>
      </div>
      <div class="pl-stage">
        <div class="pl-lockup-host" data-pl-lockup-host></div>
      </div>
      <div class="pl-concrete" data-pl-concrete></div>
      <footer class="pl-footer">
        <p class="pl-status" data-pl-status>Blueprinting… 0%</p>
        <div class="pl-progress"><div class="pl-progress__fill" data-pl-progress-fill></div></div>
      </footer>
    </div>
    <button type="button" class="preloader-skip preloader-skip--light" data-pl-skip>Skip</button>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="../_shared/brand-mark.js"></script>
    <script src="../_shared/preloader-utils.js"></script>
    <script src="./dynamic-blueprint.js"></script>
  </body>
</html>
