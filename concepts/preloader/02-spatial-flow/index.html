<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preloader — Spatial Flow</title>
    <link rel="preload" href="../../../brand/icon-source.png" as="image" />
    <link rel="stylesheet" href="../../../assets/fonts/gotham/gotham.css" />
    <link rel="stylesheet" href="../_shared/brand.css" />
    <link rel="stylesheet" href="../_shared/page-shell.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-preloading">
    <header class="page-header">
      <div class="page-header__slot" data-page-logo-slot></div>
      <nav class="page-nav" aria-label="Primary">
        <a href="#">About</a><a href="#">Services</a><a href="#">Projects</a><a href="#">Contact</a>
      </nav>
    </header>

    <main class="page-hero">
      <div class="page-hero__media">
        <img src="../../../src/assets/images/hero/bedroom.jpg" alt="" />
        <div class="page-hero__shade"></div>
      </div>
      <div class="page-hero__copy">
        <h1>Crafted for living.</h1>
        <p>From concept to installation — spaces that feel inevitable.</p>
      </div>
    </main>

    <div class="pl-preloader" data-pl-preloader>
      <canvas class="pl-canvas" data-pl-canvas aria-hidden="true"></canvas>
      <div class="pl-vignette" aria-hidden="true"></div>
      <div class="pl-corridor" aria-hidden="true"></div>

      <div class="pl-ui">
        <div class="pl-lockup-host" data-pl-lockup-host></div>
        <div class="pl-ring-wrap">
          <svg class="pl-ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="pl-ring__track" cx="60" cy="60" r="52" />
            <circle class="pl-ring__fill" data-pl-ring-fill cx="60" cy="60" r="52" />
          </svg>
          <div class="pl-ring__label">
            <span class="pl-ring__pct" data-pl-ring-pct>0%</span>
            <span class="pl-ring__status">CALCULATING<br />SPACE SOLUTION</span>
          </div>
        </div>
      </div>
    </div>

    <button type="button" class="preloader-skip" data-pl-skip>Skip</button>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="../_shared/brand-mark.js"></script>
    <script src="../_shared/preloader-utils.js"></script>
    <script src="./spatial-flow.js"></script>
  </body>
</html>
