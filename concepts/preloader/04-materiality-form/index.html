<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preloader — Materiality & Form</title>
    <link rel="preload" href="../../../brand/icon-source.png" as="image" />
    <link rel="stylesheet" href="../../../assets/fonts/gotham/gotham.css" />
    <link rel="stylesheet" href="../_shared/brand.css" />
    <link rel="stylesheet" href="../_shared/page-shell.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-preloading">
    <header class="page-header">
      <div class="page-header__slot" data-page-logo-slot></div>
      <nav class="page-nav" aria-label="Primary">
        <a href="#">About</a><a href="#">Services</a><a href="#">Projects</a><a href="#">Contact</a>
      </nav>
    </header>

    <main class="page-hero">
      <div class="page-hero__media">
        <img src="../../../src/assets/images/projects/modular-kitchen.jpeg" alt="" />
        <div class="page-hero__shade"></div>
      </div>
      <div class="page-hero__copy">
        <h1>Material craft, digital precision.</h1>
        <p>From marble to walnut — every surface tells a story.</p>
      </div>
    </main>

    <div class="pl-preloader" data-pl-preloader>
      <div class="pl-blueprint" aria-hidden="true"></div>
      <div class="pl-walnut" data-pl-walnut aria-hidden="true"></div>
      <div class="pl-glow" data-pl-glow aria-hidden="true"></div>

      <div class="pl-swatches" data-pl-swatches aria-hidden="true">
        <div class="pl-swatch pl-swatch--marble" data-pl-swatch><span>Marble</span></div>
        <div class="pl-swatch pl-swatch--walnut" data-pl-swatch><span>Walnut</span></div>
        <div class="pl-swatch pl-swatch--gold" data-pl-swatch><span>Gold leaf</span></div>
        <div class="pl-swatch pl-swatch--leather" data-pl-swatch><span>Leather</span></div>
      </div>

      <div class="pl-stage">
        <div class="pl-lockup-host" data-pl-lockup-host></div>
      </div>

      <footer class="pl-footer">
        <p class="pl-status" data-pl-status>Materializing design…</p>
        <div class="pl-progress">
          <div class="pl-progress__track"><div class="pl-progress__fill" data-pl-progress-fill></div></div>
          <span class="pl-progress__pct" data-pl-progress-pct>0%</span>
        </div>
      </footer>
    </div>

    <button type="button" class="preloader-skip" data-pl-skip>Skip</button>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/MotionPathPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="../_shared/brand-mark.js"></script>
    <script src="../_shared/preloader-utils.js"></script>
    <script src="./materiality.js"></script>
  </body>
</html>
