<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preloader — Aperture Iris</title>
    <link rel="preload" href="../../../brand/icon-source.png" as="image" />
    <link rel="stylesheet" href="../../../assets/fonts/gotham/gotham.css" />
    <link rel="stylesheet" href="../_shared/brand.css" />
    <link rel="stylesheet" href="../_shared/page-shell.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-preloading">
    <header class="page-header">
      <div class="page-header__slot" data-page-logo-slot></div>
      <nav class="page-nav" aria-label="Primary">
        <a href="#">About</a><a href="#">Services</a><a href="#">Projects</a><a href="#">Contact</a>
      </nav>
    </header>

    <main class="page-hero">
      <div class="page-hero__media">
        <img src="../../../src/assets/images/hero/kitchen-2.jpeg" alt="" />
        <div class="page-hero__shade"></div>
      </div>
      <div class="page-hero__copy">
        <h1>We frame the light.</h1>
        <p>Six gold blades open like a lens, bringing every Space Solution interior into focus.</p>
      </div>
    </main>

    <div class="pl-preloader" data-pl-preloader aria-hidden="false">
      <div class="pl-stage">
        <div class="pl-ring" data-pl-ring aria-hidden="true"></div>
        <div class="pl-lockup-host brand-lockup--center" data-pl-lockup-host></div>
      </div>
      <div class="pl-aperture" data-pl-aperture aria-hidden="true">
        <div class="pl-aperture__blade" data-pl-blade><span class="pl-aperture__leaf" data-pl-leaf></span></div>
        <div class="pl-aperture__blade" data-pl-blade><span class="pl-aperture__leaf" data-pl-leaf></span></div>
        <div class="pl-aperture__blade" data-pl-blade><span class="pl-aperture__leaf" data-pl-leaf></span></div>
        <div class="pl-aperture__blade" data-pl-blade><span class="pl-aperture__leaf" data-pl-leaf></span></div>
        <div class="pl-aperture__blade" data-pl-blade><span class="pl-aperture__leaf" data-pl-leaf></span></div>
        <div class="pl-aperture__blade" data-pl-blade><span class="pl-aperture__leaf" data-pl-leaf></span></div>
      </div>
    </div>

    <button type="button" class="preloader-skip preloader-skip--light" data-pl-skip>Skip</button>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="../_shared/brand-mark.js"></script>
    <script src="../_shared/preloader-utils.js"></script>
    <script src="./aperture-iris.js"></script>
  </body>
</html>
