<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preloader — Editorial Curtain</title>
    <link rel="preload" href="../../../brand/icon-source.png" as="image" />
    <link rel="preload" href="../../../src/assets/images/hero/kitchen-2.jpeg" as="image" />
    <link rel="preload" href="../../../src/assets/images/hero/bedroom.jpg" as="image" />
    <link
      rel="preload"
      href="../../../assets/fonts/gotham/gothamblack-webfont.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="../../../assets/fonts/gotham/gothambook-webfont.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../../../assets/fonts/gotham/gotham.css" />
    <link rel="stylesheet" href="../_shared/brand.css" />
    <link rel="stylesheet" href="../_shared/page-shell.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="is-preloading">
    <header class="page-header">
      <div class="page-header__slot"></div>
      <nav class="page-nav" aria-label="Primary">
        <a href="#">About</a><a href="#">Services</a><a href="#">Projects</a><a href="#">Contact</a>
      </nav>
    </header>

    <main class="page-hero">
      <div class="page-hero__media">
        <img src="../../../src/assets/images/hero/kitchen-1.jpeg" alt="" />
        <div class="page-hero__shade"></div>
      </div>
      <div class="page-hero__copy">
        <h1>Interiors, end to end.</h1>
        <p>Design, manufacturing and installation — delivered by one team in Mysuru.</p>
      </div>
    </main>

    <div class="pl-preloader" data-pl-preloader>
      <div class="pl-curtain" data-pl-curtain>
        <div class="pl-half pl-half--top">
          <div class="pl-stack" data-pl-stack></div>
        </div>
        <div class="pl-half pl-half--bottom">
          <div class="pl-stack" data-pl-stack></div>
        </div>
      </div>

      <div class="pl-hud" data-pl-hud>
        <div class="pl-hud__top">
          <span class="pl-hud__mark">Space Solution</span>
          <span class="pl-hud__loc">Mysuru · Est. 2016</span>
        </div>
        <div class="pl-hud__foot">
          <span class="pl-counter" data-pl-counter>000</span>
          <span class="pl-caption" data-pl-caption>Modular Kitchen · Kuvempunagar</span>
        </div>
      </div>

      <div class="pl-rule" aria-hidden="true">
        <span class="pl-rule__fill" data-pl-rule></span>
      </div>

      <div class="pl-lockup-host" data-pl-lockup-host></div>
    </div>

    <button type="button" class="preloader-skip" data-pl-skip>Skip</button>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/CustomEase.min.js"></script>
    <script src="../_shared/brand-mark.js"></script>
    <script src="../_shared/preloader-utils.js"></script>
    <script src="./editorial-curtain.js"></script>
  </body>
</html>
