<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01 · Cinematic camera — Interior WebGL Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <header class="ii-nav">
      <a class="ii-nav__mark" href="../index.html">space <span>SOLUTION</span></a>
      <a href="../index.html">← Concepts</a>
    </header>

    <!--
      CONFIG: edit CONFIG in interactive-interior.js
      Swap modelPath to your production .glb
    -->
    <section
      class="ii-hero"
      data-interactive-interior
      aria-label="Residential interiors"
    >
      <div class="ii-hero__grid">
        <div class="ii-hero__copy">
          <p class="ii-hero__eyebrow">Home Interiors / Residential</p>
          <h1 class="ii-hero__title">
            <span class="ii-hero__title-light">Free 3D</span>
            <span>Home Interiors</span>
          </h1>
          <p class="ii-hero__lead">
            Your home should reflect your personality. We deliver end-to-end interior
            solutions from kitchens to bedrooms.
          </p>
          <a class="ii-hero__cta" href="#">Get Quote Now</a>
        </div>

        <div class="ii-hero__visual">
          <div class="ii-hero__stats" role="list">
            <div class="ii-hero__stat" role="listitem">
              <span class="ii-hero__stat-value">15+</span>
              <span class="ii-hero__stat-label">Years</span>
            </div>
            <div class="ii-hero__stat" role="listitem">
              <span class="ii-hero__stat-value">800+</span>
              <span class="ii-hero__stat-label">Homes</span>
            </div>
            <div class="ii-hero__stat" role="listitem">
              <span class="ii-hero__stat-value">1</span>
              <span class="ii-hero__stat-label">Factory</span>
            </div>
          </div>

          <div class="ii-stage" data-ii-stage>
            <canvas class="ii-canvas" data-ii-canvas aria-hidden="true"></canvas>
            <figure class="ii-fallback" data-ii-fallback hidden>
              <img
                src="../../../src/assets/images/open-house/open-house-1.png"
                alt="Residential interior preview"
                width="1200"
                height="825"
              />
            </figure>
            <div class="ii-label" data-ii-label hidden></div>
          </div>

          <p class="ii-hint">Move across the interior</p>
        </div>
      </div>
    </section>

    <div class="ii-filler" aria-hidden="true">Scroll content placeholder</div>

    <script type="module" src="./interactive-interior.js"></script>
  </body>
</html>
